{% extends "base.html" %}

{% block title %}Registrar{% endblock %}

{% block content %}
  <section class="card">
    <h1>Criar conta</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Registrar</button>
    </form>
    <p class="muted">
      Já tem conta? <a href="{% url 'login' %}">Entrar</a>
    </p>
  </section>
{% endblock %}
